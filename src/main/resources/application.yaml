spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.secrets.properties
  application:
    name: spring-security-oauth2-client-demo
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:oauth2_client_demo}
    username: ${DB_USERNAME:oauth2_demo}
    password: ${DB_PASSWORD:oauth2_demo}
  flyway:
    enabled: true
    placeholders:
      admin_password_hash: ${OAUTH2_ADMIN_PASSWORD_HASH:}
  thymeleaf:
    cache: false
  session:
    timeout: 30m
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
